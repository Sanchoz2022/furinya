[package]
name = "furinya-deploy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "furinya-deploy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ssh2 = "0.9"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
flate2 = "1"
