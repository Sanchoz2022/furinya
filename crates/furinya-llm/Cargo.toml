[package]
name = "furinya-llm"
edition = "2024"
version.workspace = true
rust-version.workspace = true

[dependencies]
furinya-core = { path = "../furinya-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
