[package]
name = "furinya-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
furinya-core = { path = "../furinya-core" }
anyhow = "1"
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "json", "stream", "socks"] }
tokio = { version = "1", features = ["fs", "rt", "rt-multi-thread", "macros", "sync"] }
