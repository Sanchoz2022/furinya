[package]
name = "furinya-tg"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
furinya-core = { path = "../furinya-core" }
furinya-llm = { path = "../furinya-llm" }
furinya-diary = { path = "../furinya-diary" }
furinya-vision = { path = "../furinya-vision" }
furinya-audio = { path = "../furinya-audio" }
furinya-sd = { path = "../furinya-sd" }
furinya-web = { path = "../furinya-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
rand = "0.8"
