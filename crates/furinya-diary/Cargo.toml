[package]
name = "furinya-diary"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
furinya-core = { path = "../furinya-core" }
furinya-llm = { path = "../furinya-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = "0.4"
